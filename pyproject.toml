[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "lexiredact"
version = "0.0.2"
description = "Privacy-preserving RAG ingestion middleware with dual-pipeline processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
{ name = "Baihela Abid Hussain" },
{ name = "Shwetan Bharat Londhe" },
{ name = "Varad Limbkar"}
]

keywords = [
"rag",
"privacy",
"pii",
"redaction",
"vector-database",
"llm",
"embeddings",
"security",
"retrieval-augmented-generation"
]

classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"Intended Audience :: Information Technology",
"Topic :: Security",
"Topic :: Software Development :: Libraries",
"Topic :: Scientific/Engineering :: Artificial Intelligence",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12"
]

dependencies = [
"pydantic>=2.0,<3.0",
"pyyaml>=6.0,<7.0"
]

[project.urls]
Homepage = "https://github.com/baihelahusain/lexiredact"
Repository = "https://github.com/baihelahusain/LexiRedact"
Issues = "https://github.com/baihelahusain/LexiRedact/issues"
Documentation = "https://github.com/baihelahusain/LexiRedact"

[project.scripts]
lexiredact = "lexiredact.cli:main"

[project.optional-dependencies]

pii = [
"presidio-analyzer",
"presidio-anonymizer",
"spacy"
]

embed = [
"sentence-transformers>=2.0"
]

store = [
"chromadb>=0.4"
]

cache = [
"redis>=5.0"
]

cli = [
"click>=8.0"
]

all = [
"presidio-analyzer",
"presidio-anonymizer",
"spacy",
"sentence-transformers>=2.0",
"chromadb>=0.4",
"redis>=5.0",
"click>=8.0"
]

dev = [
"pytest>=8.0",
"pytest-asyncio>=0.23",
"ruff>=0.6",
"mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["lexiredact"]

[tool.hatch.build.targets.sdist]
exclude = [
"/.github",
"/build",
"/chroma_db",
"/demo",
"/dist",
"/eval",
"/my.py",
"/venv",
"/__pycache__"
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
